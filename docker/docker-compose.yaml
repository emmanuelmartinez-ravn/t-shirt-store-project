services:
  postgres:
    image: postgres:17
    container_name: tshirt-store-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tshirt_store
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tshirt-store-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
